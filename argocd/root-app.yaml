# App of Apps 루트 매니페스트 — argocd/apps/ 를 재귀 감시하여 하위 Application을 자동 관리한다.
# root-app 자체는 최초 1회 `kubectl apply -f argocd/root-app.yaml` 로 부트스트랩한다.
#
# ─────────────── sync-wave 규약 (argocd/apps/ 하위 Application 공용) ───────────────
# 하나의 App of Apps sync가 시작되면 아래 순서대로 wave가 진행된다.
# 앞 wave의 모든 Application이 Healthy 되어야 다음 wave가 시작된다 (대기 시간 부여 X).
#
#   wave "0"  = 인프라       예) Gateway API, ExternalSecrets, 전역 Namespace/Quota
#   wave "1"  = 플랫폼       예) monitoring(kube-prometheus-stack), messaging(Kafka), tracing(Tempo)
#   wave "2"  = 애플리케이션  예) notiflex-smb, notiflex-enterprise 등 워크로드
#
# 새 Application 추가 시 반드시 wave 하나를 지정한다:
#   metadata:
#     annotations:
#       argocd.argoproj.io/sync-wave: "1"
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jheon-eom/notiflex-platform.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
