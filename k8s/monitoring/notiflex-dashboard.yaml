apiVersion: v1
kind: ConfigMap
metadata:
  name: notiflex-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  notiflex.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["notiflex"],
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "Notiflex",
      "uid": "notiflex-overview",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Pod CPU 사용량 (cores)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"notiflex\", container!=\"\", container!=\"POD\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "none"}, "overrides": []}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Pod 메모리 사용량 (Working Set)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"notiflex\", container!=\"\", container!=\"POD\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pod 네트워크 수신 (B/s)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"notiflex\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pod 재시작 횟수 (누적)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"notiflex\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP 요청 수 (앱 계측 추가 시 표시 — ch8.2)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (pod) (rate(http_requests_total{namespace=\"notiflex\"}[2m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        }
      ]
    }
