apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-restart-alert
  namespace: monitoring
  labels:
    # kube-prometheus-stack Helm release 이름과 일치해야 Prometheus가 로드함
    release: kube-prometheus
spec:
  groups:
    - name: notiflex-alerts
      interval: 30s
      rules:
        # 실전 규칙: notiflex Pod이 5분간 3회 이상 재시작하면 warning
        - alert: PodRestartTooMany
          expr: increase(kube_pod_container_status_restarts_total{namespace="notiflex"}[5m]) > 2
          for: 1m
          labels:
            severity: warning
            team: notiflex
          annotations:
            summary: "Pod {{ $labels.pod }} 재시작 과다"
            description: "{{ $labels.namespace }}/{{ $labels.pod }}가 최근 5분 내 {{ $value }}회 재시작했습니다."

        # 실전 규칙: notiflex 컨테이너 CPU 사용률이 requests(50m) 대비 80% 초과 5분 지속
        - alert: NotiflexHighCpu
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="notiflex", container!="", container!="POD"}[3m]))
              / sum by (pod) (kube_pod_container_resource_requests{namespace="notiflex", resource="cpu"})
              > 0.8
          for: 5m
          labels:
            severity: warning
            team: notiflex
          annotations:
            summary: "Pod {{ $labels.pod }} CPU 사용률 높음"
            description: "5분 평균 CPU가 requests의 {{ $value | humanizePercentage }}입니다."

        # 검증용: 규칙 배포 즉시 firing되는 테스트 alert.
        # Pod 삭제 없이도 Prometheus → Alertmanager 라우팅 파이프라인을 검증할 수 있다.
        # 검증이 끝나면 이 규칙은 제거하거나 주석 처리한다.
        - alert: NotiflexAlertPipelineTest
          expr: vector(1)
          for: 30s
          labels:
            severity: info
            team: notiflex
          annotations:
            summary: "알림 파이프라인 검증용 (항상 firing)"
            description: "이 alert이 Alertmanager UI에 표시되면 PrometheusRule → Prometheus → Alertmanager 경로가 정상입니다."
