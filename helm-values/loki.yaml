deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 5m
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# SimpleScalable(read/write/backend) 비활성화 — SingleBinary만 사용
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# 게이트웨이/chunks-cache/results-cache는 SingleBinary + 학습 환경에서 불필요
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# 배포 검증용 test-pod 비활성화 (챕터 범위 밖)
test:
  enabled: false
lokiCanary:
  enabled: false

# Loki chart가 만드는 Grafana datasource는 사용하지 않음
# (별도 ConfigMap으로 등록해 isDefault=false 명시)
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
