tempo:
  reportingEnabled: false
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

persistence:
  enabled: false

nodeSelector:
  cloud.google.com/gke-nodepool: ops-pool

serviceMonitor:
  enabled: false
